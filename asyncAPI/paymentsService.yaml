asyncapi: 3.0.0
info:
  title: Payment Service AsyncAPI
  version: 1.0.0
  description: >
    Контракт Payment Service. Читает событие создания заказа из топика
    orders.created.v1, обрабатывает платёж и публикует событие
    payments.processed.v1 в Kafka.

servers:
  production:
    host: kafka-1.prod.internal:9092
    protocol: kafka-secure
    protocolVersion: '3.7'
    description: Продуктивный Kafka-кластер

channels:
  orderCreated:
    address: orders.created.v1
    description: Топик событий создания заказа
    bindings:
      kafka:
        partitions: 12
        replicas: 3
        minInSyncReplicas: 2
        retention:
          ms: 604800000

    messages:
      orderCreated:
        $ref: '#/components/messages/OrderCreated'

  paymentProcessed:
    address: payments.processed.v1
    description: Топик событий обработки платежа
    bindings:
      kafka:
        partitions: 12
        replicas: 3
        minInSyncReplicas: 2
        retention:
          ms: 604800000

    messages:
      paymentProcessed:
        $ref: '#/components/messages/PaymentProcessed'

operations:
  receiveOrderCreated:
    action: receive
    channel:
      $ref: '#/channels/orderCreated'
    messages:
      - $ref: '#/channels/orderCreated/messages/orderCreated'
    bindings:
      kafka:
        groupId: payment-service-consumers

  sendPaymentProcessed:
    action: send
    channel:
      $ref: '#/channels/paymentProcessed'
    messages:
      - $ref: '#/channels/paymentProcessed/messages/paymentProcessed'
    bindings:
      kafka:
        clientId: payment-service-producer

components:
  messages:
    OrderCreated:
      name: OrderCreated
      title: Заказ создан
      summary: Событие успешного создания заказа
      headers:
        type: object
        properties:
          eventType:
            type: string
            description: Тип события, например orders.created
          eventVersion:
            type: string
            description: Версия схемы события, например v1
          traceId:
            type: string
            description: Идентификатор сквозной трассировки (UUID)
      payload:
        $ref: '#/components/schemas/OrderCreatedPayload'
      bindings:
        kafka:
          key:
            type: string
            description: >
              Ключ сообщения. Значение: orderId.
              Используется для сохранения порядка событий одного заказа
              и направления их в одну партицию.

    PaymentProcessed:
      name: PaymentProcessed
      title: Платёж обработан
      summary: Событие успешной обработки платежа
      headers:
        type: object
        properties:
          eventType:
            type: string
            description: Тип события, например payments.processed
          eventVersion:
            type: string
            description: Версия схемы события, например v1
          traceId:
            type: string
            description: Идентификатор сквозной трассировки (UUID)
      payload:
        $ref: '#/components/schemas/PaymentProcessedPayload'
      bindings:
        kafka:
          key:
            type: string
            description: >
              Ключ сообщения. Значение: orderId.
              Используется для сохранения порядка событий одного заказа
              и направления их в одну партицию.

  schemas:
    PaymentProcessedPayload:
      type: object
      required:
        - orderId
        - userId
        - paymentId
        - paymentStatus
        - amount
        - currency
        - eventId
        - occurredAt
      properties:
        orderId:
          type: string
          description: Уникальный идентификатор заказа
        userId:
          type: string
          description: Уникальный идентификатор пользователя
        paymentId:
          type: string
          description: Уникальный идентификатор платежа
        paymentStatus:
          type: string
          enum:
            - SUCCESS
          description: Статус платежа. В текущей версии всегда SUCCESS
        amount:
          type: string
          pattern: '^\d+(\.\d{1,2})?$'
          description: Сумма платежа. Строка для корректных вычислений и сериализации
        currency:
          type: string
          pattern: '^[A-Z]{3}$'
          description: Валюта по ISO 4217, три заглавные буквы
        eventId:
          type: string
          format: uuid
          description: Уникальный идентификатор события. Используется для дедупликации и идемпотентной обработки
        occurredAt:
          type: string
          format: date-time
          description: Бизнес-время события — момент успешной обработки платежа
      additionalProperties: false

    OrderCreatedPayload:
      type: object
      required:
        - orderId
        - userId
        - amount
        - currency
        - eventId
        - occurredAt
      properties:
        orderId:
          type: string
          description: Уникальный идентификатор заказа
        userId:
          type: string
          description: Уникальный идентификатор пользователя
        amount:
          type: string
          pattern: '^\d+(\.\d{1,2})?$'
          description: Сумма заказа. Является строкой, в целях корректного вычисления и сериализации
        currency:
          type: string
          pattern: '^[A-Z]{3}$'
          description: Валюта по ISO 4217, три заглавные буквы
        eventId:
          type: string
          format: uuid
          description: Уникальный идентификатор события. Используется для дедупликации и идемпотентной обработки
        occurredAt:
          type: string
          format: date-time
          description: Бизнес-время возникновения события (не время чтения/обработки)
      additionalProperties: false

