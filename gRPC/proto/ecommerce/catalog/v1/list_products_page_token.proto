syntax = "proto3";

package ecommerce.catalog.v1;

// Внутренний токен пагинации списка товаров.
// ВНИМАНИЕ: клиент НЕ разбирает содержимое этого сообщения.
// В поле ListProductsResponse.next_page_token он получает это сообщение,
// сериализованное в бинарный вид и закодированное в web-safe Base64.
// Клиент обязан обращаться с токеном как с непрозрачной строкой.
message ListProductsPageToken {
  string last_product_id = 1; // id последнего товара предыдущей страницы
}
