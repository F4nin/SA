syntax = "proto3";

package ecommerce.catalog.v1;

// Категория товара. Категории образуют дерево:
// у корневой категории родителя нет, у дочерней parent_id ссылается
// на родительскую категорию.
//
// Категория — это сообщение, а не enum, потому что enum умеет описывать
// только плоский закрытый список значений, а категории вложены друг в друга
// и управляются данными (их добавляют, переименовывают, скрывают).
message Category {
  string id = 1;
  optional string parent_id = 2;  // id родительской категории; не задан для корневой
  string name = 3; // название категории, показываемое пользователю
}