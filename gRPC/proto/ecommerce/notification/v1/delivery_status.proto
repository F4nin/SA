syntax = "proto3";

package ecommerce.notification.v1;

// Статус доставки уведомления.
// Первое значение всегда 0 и означает "не задано" — это значение по умолчанию
// для любого enum-поля, поэтому оно не может обозначать реальный статус.
enum DeliveryStatus{
  DELIVERY_STATUS_UNSPECIFIED= 0;
  DELIVERY_STATUS_PENDING = 1;
  DELIVERY_STATUS_SENT = 2;
  DELIVERY_STATUS_DELIVERED = 3;
  DELIVERY_STATUS_FAILED = 4;
}