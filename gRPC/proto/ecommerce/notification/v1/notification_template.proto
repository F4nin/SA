syntax = "proto3";

package ecommerce.notification.v1;

// Шаблон уведомления.
// Содержит текст в которые подставляются данные конкретного
// пользователя или заказа при формировании готового уведомления.
message NotificationTemplate {
  string id = 1;   // уникальный идентификатор шаблона
  string name = 2; // название шаблона, например "Подтверждение заказа"
  string body = 3; // текст шаблона с плейсхолдерами
}