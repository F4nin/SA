syntax = "proto3";

package ecommerce.order.v1;



// Адрес доставки заказа.
// Хранится как снимок на момент оформления заказа,
// чтобы изменение адреса в профиле пользователя не меняло прошлые заказы.
message Address {
  string country = 1;
  string city = 2;
  string street = 3;
  string zip_code = 4;
}