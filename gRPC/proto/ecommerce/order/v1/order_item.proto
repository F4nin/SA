syntax = "proto3";

package ecommerce.order.v1;



// Позиция заказа — это снимок (snapshot) товара на момент оформления заказа.
// Мы сохраняем название и цену прямо в заказе, чтобы изменения каталога
// (смена цены, названия или удаление товара) не влияли на уже созданные заказы.
message OrderItem{
  string product_id = 1;
  string product_name = 2;  // название товара на момент заказа
  int64 unit_price_minor_units = 3; // цена позиции в минорных единицах на момент заказа
  int32 quantity = 4;
}