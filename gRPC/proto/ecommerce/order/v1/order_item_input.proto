syntax = "proto3";

package ecommerce.order.v1;



// Входная позиция при создании заказа.
// Клиент передаёт только идентификатор товара и количество.
// Название и цену сервер берёт из каталога в момент создания заказа,
// поэтому клиент не может подделать цену или название.
message OrderItemInput{
  string product_id = 1;
  int32 quantity = 2;
}