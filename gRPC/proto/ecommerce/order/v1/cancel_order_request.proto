syntax = "proto3";

package ecommerce.order.v1;



// Запрос на отмену заказа.
// Отмена выделена в отдельный RPC, а не делается через UpdateOrderStatus,
// потому что она несёт дополнительную бизнес-логику: возврат средств,
// снятие резерва товара, уведомление пользователя.
// Порядок переходов проверяет сервер (нельзя отменить завершённый
// или уже отменённый заказ).
message CancelOrderRequest{
  string order_id = 1;
  optional string reason = 2;
}